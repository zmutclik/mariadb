services:
  mariadb:
    build: .
    container_name: ${CONTAINER_NAME}
    hostname: ${HOSTNAME}
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOTPASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_APPUSER}
      MARIADB_PASSWORD: ${DB_APPPASS}
      BACKUP_USER: ${BACKUP_USER}
      BACKUP_PASS: ${BACKUP_PASS}
      BACKUP_CRON: ${BACKUP_CRON:-}
      DUMP_CRON: ${DUMP_CRON:-}
      BINLOG_CRON: ${BINLOG_CRON:-}
      # Buat user healthcheck & jalankan mariadb-upgrade otomatis saat versi naik
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "${DATA_PORT}:3306"
    volumes:
      - data:/var/lib/mysql
      - backup:/backup
    dns:
      - ${DNS1}
      - ${DNS2}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
#    driver_opts:
#      type: nfs
#      o: addr=${NFS_ADDRESS},nfsvers=4
#      device: ${NFS_DATA_PATH}
  backup:
